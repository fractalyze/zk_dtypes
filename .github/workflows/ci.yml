name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Ensure that only a single job or workflow using the same
# concurrency group will run at a time. This would cancel
# any in-progress jobs in the same github workflow and github
# ref (e.g. refs/heads/main or refs/pull/<pr_number>/merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # zk_dtypes resolves through MODULE.bazel only, so this is the whole build.
  build-and-test:
    runs-on: [self-hosted, cpu]
    steps:
      # Full history so bazel-diff can check out and hash the PR base revision.
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs build and test only the targets bazel-diff reports as impacted by
      # the base..head change; pushes to main run the full suite.
      - name: Run `bazel test` (diff only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BAZEL_DIFF=$(mktemp -t bazel-diff.XXXXXX.jar)
          # Fetch via the release API rather than the browser-download CDN: the
          # latter intermittently 504s and a bare `curl -Lo` would save the HTML
          # error page as a corrupt jar. `gh` validates the asset and --clobber
          # overwrites the mktemp placeholder.
          gh release download 17.0.2 --repo Tinder/bazel-diff \
            --pattern bazel-diff_deploy.jar --output "$BAZEL_DIFF" --clobber
          ./build_tools/github_actions/ci_build_bazel.sh "$BAZEL_DIFF" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Run `bazel test` (all)
        if: github.event_name != 'pull_request'
        run: ./build_tools/github_actions/ci_build_bazel.sh

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the gtest output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main

  # The lane above builds zk_dtypes as the *root* module, where patches and
  # overrides still apply; a consumer resolves it as a non-root module, where
  # they do not. Only a separate module can tell the two apart, so this lane
  # builds one — the second acceptance criterion of #187.
  bzlmod-consumer:
    runs-on: [self-hosted, cpu]
    steps:
      # Full history so the change detection below can diff against the PR base.
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What zk_dtypes exposes to a consumer is decided entirely by its build
      # definition, so a PR touching none of those files cannot change this
      # lane's result. Pushes to main always run it.
      - name: Detect build-definition changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "Not a pull request; running the lane."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `*.bazel*` covers MODULE.bazel(.lock), BUILD.bazel, .bazelrc*,
          # .bazelversion and .bazelignore at any depth: pathspecs use
          # git's default wildmatch, where `*` also crosses `/`. The pip locks are
          # read by `pip.parse` in MODULE.bazel, so they change what a consumer
          # resolves. The last entry re-runs the lane when its own definition
          # changes.
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            '*.bazel*' '*.bzl' 'third_party' 'bazel' \
            '*requirements_lock_*.txt' '.github/workflows/ci.yml')
          if [[ -n "$CHANGED" ]]; then
            echo "Build-definition files changed:"
            echo "$CHANGED"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-definition change; skipping the consumer lane."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run `bazel test` in the consumer module
        if: steps.changes.outputs.run == 'true'
        working-directory: bazel/bzlmod_consumer
        run: |
          # This fixture's own lock is deliberately unpinned, so it overrides
          # the `--lockfile_mode=error` .bazelrc.ci sets for the root build.
          bazel --bazelrc="${GITHUB_WORKSPACE}/.bazelrc.ci" test \
            --config=ci \
            --lockfile_mode=update \
            //...

      - name: Resolve every zk_dtypes target as a dependency
        if: steps.changes.outputs.run == 'true'
        working-directory: bazel/bzlmod_consumer
        run: |
          bazel --bazelrc="${GITHUB_WORKSPACE}/.bazelrc.ci" build \
            --config=ci \
            @zk_dtypes//zk_dtypes/... \
            @zk_dtypes//third_party/...

      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main

  pre-commit-style:
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      - name: Checkout Setup Python
        uses: actions/setup-python@v4.7.0
        with:
          python-version: "3.11"

      - name: Install cpplint
        run: pip install cpplint

      - name: Run pre-commit github action
        uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # pin@v3

  notebook-check:
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      # Use the same hosted-toolcache Python as pre-commit-style (it matches
      # bazel's hermetic 3.11) instead of the runner's system Python: system
      # Pythons on updated runner boxes carry the PEP 668 EXTERNALLY-MANAGED
      # marker, which makes every bare `pip install` below fail.
      - name: Setup Python
        uses: actions/setup-python@v4.7.0
        with:
          python-version: "3.11"

      - name: Build zk_dtypes
        run: |
          bazel build //zk_dtypes:_zk_dtypes_ext.so

      - name: Install zk_dtypes
        env:
          USE_BAZEL_OUTPUT: 1
        run: |
          pip install .

      - name: Install notebook dependencies
        run: |
          pip install jupyter nbconvert ipykernel

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output zk_dtypes_examples.nbconvert.ipynb \
            examples/zk_dtypes_examples.ipynb

      - name: Compare notebook outputs
        run: |
          python scripts/check_notebook_outputs.py \
            examples/zk_dtypes_examples.ipynb \
            examples/zk_dtypes_examples.nbconvert.ipynb
