name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Ensure that only a single job or workflow using the same
# concurrency group will run at a time. This would cancel
# any in-progress jobs in the same github workflow and github
# ref (e.g. refs/heads/main or refs/pull/<pr_number>/merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORARY (draft-PR only, do not merge): fan 6 copies across the runner
  # pool so at least one lands on each build-server-3 slot. Fingerprints the
  # box toolchain and reruns the GoldilocksX3 Pil2 goldens 20x — the tests
  # that fail deterministically on build-server-3-cpu-* and pass on gpu1-*.
  diagnose-runner:
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, cpu]
    continue-on-error: true
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      - name: Toolchain fingerprint
        run: |
          echo "runner: ${{ runner.name }}"
          uname -a
          head -3 /etc/os-release
          gcc --version | head -1
          g++ --version | head -1
          ld --version | head -1
          python3 --version
          ls /usr/lib/python3.*/EXTERNALLY-MANAGED 2>/dev/null || echo "(no PEP 668 marker)"
          nproc
          free -h | head -2

      - name: Repro GoldilocksX3 Pil2 goldens 20x
        run: |
          bazel --bazelrc=.bazelrc.ci test \
            --config=ci \
            --test_filter='GoldilocksX3Test.*' \
            --runs_per_test=20 \
            --cache_test_results=no \
            --test_output=errors \
            //zk_dtypes:field_unittests

  build-and-test:
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      - name: Run `bazel test`
        run: |
          bazel --bazelrc=.bazelrc.ci test \
            --config=ci \
            //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the gtest output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main

  pre-commit-style:
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      - name: Checkout Setup Python
        uses: actions/setup-python@v4.7.0
        with:
          python-version: "3.11"

      - name: Install cpplint
        run: pip install cpplint

      - name: Run pre-commit github action
        uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # pin@v3

  notebook-check:
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout zk_dtypes
        uses: actions/checkout@v4

      - name: Build zk_dtypes
        run: |
          bazel build //zk_dtypes:_zk_dtypes_ext.so

      - name: Install zk_dtypes
        env:
          USE_BAZEL_OUTPUT: 1
        run: |
          pip install .

      - name: Install notebook dependencies
        run: |
          pip install jupyter nbconvert ipykernel

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output zk_dtypes_examples.nbconvert.ipynb \
            examples/zk_dtypes_examples.ipynb

      - name: Compare notebook outputs
        run: |
          python scripts/check_notebook_outputs.py \
            examples/zk_dtypes_examples.ipynb \
            examples/zk_dtypes_examples.nbconvert.ipynb
